
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReFind | Report Lost Item</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="page-container">

        <header class="page-header">
            <div>
                <h1>ReFind<span>.</span></h1>
                <p>Campus Lost & Found Management System</p>
            </div>

            <a href="/" class="back-link">← Dashboard</a>
        </header>

        <main class="form-page">

            <div class="page-title">
                <p class="eyebrow">LOST ITEM REGISTRATION</p>
                <h2>Report a Lost Item</h2>
                <p>Provide the details below to help locate your belongings.</p>
            </div>

            <div class="form-card">

                <form action="/report-lost" method="POST">

                    <div class="form-group">
                        <label>Item Name</label>
                        <input type="text" name="name"
                               placeholder="e.g. Black Wallet" required>
                    </div>

                    <div class="form-group">
                        <label>Category</label>
                        <input type="text" name="category"
                               placeholder="e.g. Accessories" required>
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="description"
                                  placeholder="Describe your item, including colour, brand or unique features"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Last Seen Location</label>
                        <input type="text" name="location"
                               placeholder="e.g. University Library" required>
                    </div>

                    <button type="submit" class="form-submit">
                        Submit Lost Report
                    </button>

                </form>

            </div>

            <p class="form-note">
                Make sure the information provided is accurate.
            </p>

        </main>

    </div>

</body>
</html>
